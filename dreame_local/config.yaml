name: Dreame Local Cloud
version: "0.9.6"
slug: dreame_local_cloud
description: Ersetzt die Dreame-Cloud lokal (MQTT/TLS) und bindet den Roboter per MQTT-Discovery in Home Assistant ein.
url: https://github.com/dwyschka/Dreame-local
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
panel_icon: mdi:robot-vacuum
panel_title: Dreame Local
ingress: true
ingress_port: 8099
map:
  - share:rw
ports:
  19973/tcp: 19973
  13267/tcp: 13267
  8443/tcp: 8443
  19980/tcp: 19980
ports_description:
  19973/tcp: Dreame-Geraete-MQTT (DNS-Rewrite hierher)
  13267/tcp: Dreame-Cloud-API (DNS-Rewrite eu.iot.dreame.tech hierher)
  8443/tcp: HTTPS-Upload (Karten/Logs)
  19980/tcp: HTTP-Upload (Karten/Logs, Standard)
options:
  device_did: ""
  device_uid: ""
  device_model: dreame.vacuum.r2469a
  region: eu
  device_name: Dreame
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  discovery_prefix: homeassistant
  lan_ip: ""
  upload_host: ""
  device_ip: ""
  mac: ""
  broker_port: 19973
  web_port: 8099
  upload_port: 8443
  upload_http_port: 19980
  upload_scheme: http
  api_port: 13267
  api_cert: ""
  api_key: ""
  log_level: info
schema:
  device_did: str
  device_uid: str
  device_model: str
  region: str
  device_name: str
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  discovery_prefix: str
  lan_ip: str
  upload_host: str
  device_ip: str
  mac: str
  broker_port: port
  web_port: port
  upload_port: port
  upload_http_port: port?
  upload_scheme: list(http|https)?
  api_port: port
  api_cert: str
  api_key: str
  log_level: list(debug|info|warning|error)
